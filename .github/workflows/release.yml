name: Release

# Runs when a version tag is pushed. The crates are published from a local checkout with
# `cargo publish --workspace`; this workflow checks the tagged commit and creates the GitHub release.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

defaults:
  run:
    shell: bash

jobs:
  tag:
    name: Check the tag
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check that the tag is on main
        run: |
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at $GITHUB_SHA, which is not on main"
            exit 1
          fi
      - name: Check that the tag names the workspace version
        run: |
          workspace=$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -1)
          if [[ "${GITHUB_REF_NAME#v}" != "$workspace" ]]; then
            echo "::error::$GITHUB_REF_NAME does not match the workspace version $workspace"
            exit 1
          fi

  ci:
    name: CI
    needs: tag
    uses: ./.github/workflows/ci.yml
    with:
      full-history: true

  release:
    name: Create the release
    needs: ci
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Create the GitHub release
        uses: softprops/action-gh-release@v2
        with:
          # The notes list the pull requests merged since the previous release.
          generate_release_notes: true
          draft: false
          prerelease: false
