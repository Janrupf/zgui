[package]
name = "zgui-gbm"
version.workspace = true
edition.workspace = true
license.workspace = true

# L2 — backends. Every dependency is inherited: `foo.workspace = true`.
#
# libgbm, and nothing about this framework. It names no zgui crate, so it is a library that happens
# to live here rather than a layer of the product: what depends on it is `zgui-platform-drm` and
# `zgui-scanout`, one step along the same layer.
#
# The crate compiles on any host. libgbm is opened at run time, so nothing here reaches an operating
# system at build time.
[dependencies]
libloading.workspace = true

[lints]
workspace = true
