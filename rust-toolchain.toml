# The pin moves deliberately, in its own commit, with CI green on the new toolchain first.
# The tree is developed on nightly: miri needs it, and so does `zgui-xkb` in the experimental
# console stack. The published crates build on stable Rust from the `rust-version` in the workspace
# manifest, and CI checks them with that toolchain.
[toolchain]
channel = "nightly-2026-04-16"
components = ["rustfmt", "clippy", "rust-src", "miri"]
profile = "minimal"
