# Fixture workspace for `cargo xtask ledger versions`.
[workspace]
members = []

[workspace.dependencies]
# PLANTED VIOLATION: not pinned to an exact patch release.
stylo = "0.19.0"
# PLANTED VIOLATION: without `effects` the whole UI compiles, runs and never updates.
reactive_graph = { version = "=0.2.14" }
reactive_stores = "=0.4.3"
any_spawner = "=0.3.0"
wgpu = "29.0.4"
# PLANTED VIOLATION: losing `grid` lays every grid out as a block with no error at all.
cephal = { version = "0.1.0", default-features = false, features = ["block", "flex"] }
